name: flake check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      - name: Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: nix flake check
        run: nix flake check